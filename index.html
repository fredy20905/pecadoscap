
<style>

  .result-sin-latin{font-style:italic;color:#6a5a3a;font-size:0.95rem;margin-bottom:1.2rem}

<div id="app"><div id="screen"></div></div>

<script>
const SINS={
  superbia:{name:'Soberbia',latin:'Superbia',icon:'👑',color:'#9b59b6',desc:'El orgullo que se niega a inclinarse ante nadie. Juzgas antes de escuchar, lideras antes de pedir permiso y consideras que tu visión del mundo es la más acertada. Es el pecado de los dioses caídos.'},
  avaritia:{name:'Avaricia',latin:'Avaritia',icon:'🪙',color:'#f1c40f',desc:'El deseo que nunca se sacia. No es solo el dinero: acumulas tiempo, afecto, reconocimiento, control. Cedes con dificultad porque lo que tienes define quién eres. El mundo es un recurso; tú, su administrador.'},
  luxuria:{name:'Lujuria',latin:'Luxuria',icon:'🌹',color:'#e74c3c',desc:'El hambre de placer y conexión en su forma más intensa. Buscas experiencias que te desborden. Cuando alguien o algo te atrae, el mundo pierde nitidez y solo queda ese deseo. Ardes con facilidad.'},
  invidia:{name:'Envidia',latin:'Invidia',icon:'🪞',color:'#1abc9c',desc:'El dolor que nace de ver brillar a otro. No envidias sin razón: hay algo que deseas profundamente y que sientes que el destino le dio a quien menos lo merecía. La envidia es una brújula rota hacia tu propósito.'},
  gula:{name:'Gula',latin:'Gula',icon:'🍷',color:'#e67e22',desc:'El exceso como forma de sentir. No se trata de comida: te entregas a las experiencias hasta el fondo. Moderarte te parece una pérdida. Vives plenamente o no vives. El mundo existe para ser saboreado.'},
  ira:{name:'Ira',latin:'Ira',icon:'🔥',color:'#e74c3c',desc:'El fuego que no pide disculpas. Sientes con intensidad y cuando algo vulnera lo que valoras, reaccionas sin filtros. La injusticia te quema. Tu ira no es caos: es un sentido de justicia que no sabe esperar.'},
  acedia:{name:'Pereza',latin:'Acedia',icon:'🌑',color:'#7f8c8d',desc:'La distancia del alma. No es cansancio físico: es una indiferencia hacia lo que debería importar. Puedes ser brillante y aun así desaparecer en el momento clave. La acedia no roba tu energía; roba tu urgencia.'},
};

const VIRTUES={
  superbia:'Tu antídoto es la humildad — no la sumisión, sino el arte de aprender de quien menos lo esperas.',
  avaritia:'Tu antídoto es la generosidad — no dar lo que sobra, sino compartir lo que cuesta compartir.',
  luxuria:'Tu antídoto es la templanza — no apagar el fuego, sino aprender a elegir dónde ardes.',
  invidia:'Tu antídoto es la admiración genuina — convertir lo que envidias en una señal de lo que tú mismo puedes crear.',
  gula:'Tu antídoto es la sobriedad — no la austeridad, sino el placer consciente que se recuerda.',
  ira:'Tu antídoto es la paciencia — no la pasividad, sino la capacidad de elegir cuándo actuar.',
  acedia:'Tu antídoto es la diligencia — no la prisa, sino el compromiso con lo que genuinamente importa.',
};

const QUESTIONS=[
  {block:'A',blockName:'Naturaleza',text:'Cuando alguien recibe un elogio que tú sientes que merecías más, tu reacción inmediata es…',type:'single',options:[{text:'Irritarme en silencio. Eso era mío.',sins:{superbia:2,invidia:2}},{text:'Analizar qué hizo esa persona distinto a mí.',sins:{invidia:1,acedia:1}},{text:'Seguir adelante. Llegaré más lejos de todas formas.',sins:{superbia:3}},{text:'Sentir una punzada, pero felicitarle genuinamente.',sins:{invidia:1}}]},
  {block:'A',blockName:'Naturaleza',text:'Un fin de semana libre sin obligaciones. ¿Cómo lo vives?',type:'single',options:[{text:'Me lanzo a placer: comida, salidas, música, lo que venga.',sins:{gula:3,luxuria:1}},{text:'Trabajo en algo que me haga avanzar. No puedo "no hacer".',sins:{superbia:1,avaritia:2}},{text:'Me quedo en cama más tiempo del planeado. El mundo puede esperar.',sins:{acedia:3}},{text:'Busco a alguien con quien compartirlo. La soledad me pesa.',sins:{luxuria:2,invidia:1}}]},
  {block:'A',blockName:'Naturaleza',text:'Cuando discutes con alguien y sientes que tienes razón, ¿qué haces?',type:'single',options:[{text:'Cedo para mantener la paz, aunque por dentro sepa que tenía razón.',sins:{acedia:2}},{text:'Presento argumentos hasta que quede claro quién tenía la razón.',sins:{superbia:3,ira:1}},{text:'Me callo, pero no olvido.',sins:{ira:2,invidia:1}},{text:'Expreso lo que pienso con fuerza y sin rodeos. No me da igual perder.',sins:{ira:3}}]},
  {block:'A',blockName:'Naturaleza',text:'Tu motivación más honesta para alcanzar el éxito es…',type:'single',options:[{text:'Que nadie pueda cuestionarme ni ignorarme.',sins:{superbia:3}},{text:'La seguridad de tener más que suficiente. Nunca depender de nadie.',sins:{avaritia:3}},{text:'Las experiencias que el dinero y el tiempo libre permiten.',sins:{gula:2,luxuria:2}},{text:'Superar a quienes siempre parecieron tenerlo más fácil.',sins:{invidia:3}}]},
  {block:'A',blockName:'Naturaleza',text:'Algo que te cuesta genuinamente hacer es…',type:'single',options:[{text:'Pedir ayuda. Prefiero tardar más y hacerlo solo.',sins:{superbia:2}},{text:'Soltar algo que ya no me sirve pero que acumulé con esfuerzo.',sins:{avaritia:3}},{text:'Frenarme cuando algo me atrae o me apasiona.',sins:{luxuria:2,gula:1}},{text:'Arrancar con algo importante cuando no tengo ganas.',sins:{acedia:3}}]},
  {block:'B',blockName:'Escenario',scenario:true,intro:'Escenario I',text:'Llevas semanas trabajando en un proyecto que te ha costado. En la presentación final, un compañero recibe todos los elogios — incluso por ideas que surgieron de ti. ¿Qué pasa dentro de ti y qué haces?',type:'text',sins_map:{keywords:{'reclamar|digo|corrijo|señalo|aclaro|reivindico':{superbia:2,ira:2},'callo|nada|guardo|trago':{acedia:2,ira:1},'aprendo|nota|curiosidad|reflexion':{invidia:1},'rabia|enojo|molest|injust|furia':{ira:3},'envidia|merezc|debía ser yo':{invidia:3},'da igual|no importa|sigo':{acedia:2},'felicito|celebro|alegr':{acedia:1}}}},
  {block:'B',blockName:'Escenario',scenario:true,intro:'Escenario II',text:'Alguien a quien amas te da a elegir: una noche de placer espontáneo que se sale de lo planeado, o cumplir un compromiso previo que puedes posponer fácilmente. ¿Qué eliges y por qué?',type:'text',sins_map:{keywords:{'placer|espontáne|vivo|ahora|aprovechar|disfrut':{luxuria:3,gula:2},'compromiso|responsab|palabra|había prometido':{superbia:1},'depende|analizo|evalúo':{avaritia:1},'él|ella|persona|amor|conexión':{luxuria:2},'posterg|después|mañana':{acedia:2}}}},
  {block:'B',blockName:'Escenario',scenario:true,intro:'Escenario III',text:'Te ofrecen una oportunidad grande, pero implica compartir crédito y recursos con alguien que no te genera confianza. ¿Cómo lo piensas? ¿Aceptas?',type:'text',sins_map:{keywords:{'no|rechazo|prefiero solo|sin él|sin ella':{superbia:2,avaritia:2},'acepto|sí|por la oportunidad':{avaritia:1},'negocio|condicion|acuerdo|límites':{avaritia:3},'desconfío|cuido|vigilo|protejo':{avaritia:2,ira:1},'da igual|me da lo mismo':{acedia:2}}}},
  {block:'C',blockName:'Tu vida real',text:'Piensa en un momento en que actuaste movido por un deseo o impulso que después te costó algo — un exceso, una reacción, una decisión que no fue tu mejor versión. Descríbelo brevemente, sin juzgarte.',type:'text',sins_map:{keywords:{'gastaste|compr|dinero|acumul':{avaritia:2,gula:1},'rabia|explot|grité|dije algo que':{ira:3},'orgullo|no pedí ayuda|no admití':{superbia:3},'pereza|no hice|postergué|dejé':{acedia:3},'celos|envidia|comparé':{invidia:3},'exceso|mucho|demasiado|desbordar':{gula:2,luxuria:1},'atracción|person|deseo|no pude resistir':{luxuria:3}}}},
  {block:'C',blockName:'Tu vida real',text:'Si tuvieras que nombrar el patrón que más se repite en tus errores o decisiones que luego lamentas — ¿qué diría alguien que te conoce bien?',type:'text',sins_map:{keywords:{'orgullo|creído|arrogante|superior':{superbia:3},'materialista|dinero|ahorrar|nunca suelto':{avaritia:3},'impulsiv|incapaz de resistir|placer|sensaciones':{luxuria:2,gula:2},'envidios|comparar|celoso':{invidia:3},'come|exceso|beber|fiesta':{gula:3},'explosiv|irascible|explotar|mal genio':{ira:3},'perezoso|dejar|procrastin|no termino':{acedia:3}}}},
];

let currentQ=0;
let scores={superbia:0,avaritia:0,luxuria:0,invidia:0,gula:0,ira:0,acedia:0};
let answers=[];
let selectedOption=null;
let textAnswer='';
let userName='';
let finalPcts={};
let finalDominant='';
let textAnswers=[];

function analyzeText(text,sins_map){
  const lower=text.toLowerCase();
  const result={};
  for(const[pattern,sinValues]of Object.entries(sins_map.keywords)){
    const regex=new RegExp(pattern,'i');
    if(regex.test(lower)){for(const[sin,val]of Object.entries(sinValues)){result[sin]=(result[sin]||0)+val}}
  }
  if(Object.keys(result).length===0){const wc=text.trim().split(/\s+/).length;if(wc>20)result['gula']=1;else result['acedia']=1;}
  return result;
}

function getProgress(){return Math.round((currentQ/QUESTIONS.length)*100)}

function renderCover(){
  document.getElementById('screen').innerHTML=`
    <div class="cover">
      <span class="cover-symbol">☩</span>
      <h1 style="font-family:'Cinzel',serif;font-size:1.8rem;letter-spacing:0.12em;color:#c9a84c;text-transform:uppercase;margin-bottom:0.5rem;line-height:1.3">Septem Peccata<br>Mortalia</h1>
      <p class="cover-sub">Un examen del alma en diez preguntas</p>
      <p class="cover-desc">Nadie escapa a los siete pecados capitales. La pregunta no es si los llevas dentro —<br>es cuál te define con mayor fuerza.<br><br>Responde con honestidad. No hay respuestas correctas,<br>solo respuestas verdaderas.</p>
      <div class="name-wrap" style="max-width:300px;margin:0 auto 2rem">
        <span class="name-label">Tu nombre (opcional)</span>
        <input class="name-input" id="name-field" type="text" placeholder="Escribe tu nombre…" maxlength="40">
      </div>
      <button class="btn-primary" onclick="startTest()">Comenzar el examen</button>
    </div>`;
}

function renderQuestion(){
  const q=QUESTIONS[currentQ];
  const progress=getProgress();
  let optionsHTML='';
  if(q.type==='single'){
    optionsHTML=`<div class="options">`+q.options.map((o,i)=>`<button class="opt-btn" id="opt-${i}" onclick="selectOption(${i})">${o.text}</button>`).join('')+`</div>`;
  } else {
    optionsHTML=`<div class="textarea-wrap"><textarea id="text-ans" placeholder="Escribe aquí, con tus propias palabras…" oninput="onTextInput(this.value)"></textarea></div>`;
  }
  const scenarioLabel=q.scenario?`<p class="q-scenario-intro">${q.intro}</p>`:'';
  document.getElementById('screen').innerHTML=`
    <div class="question-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <p class="block-label">Bloque ${q.block} — ${q.blockName}</p>
      <p class="q-number">Pregunta ${currentQ+1} de ${QUESTIONS.length}</p>
      ${scenarioLabel}
      <p class="q-text">${q.text}</p>
      ${optionsHTML}
      <div class="nav-row"><button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Continuar →</button></div>
    </div>`;
  selectedOption=null;textAnswer='';
}

function selectOption(i){
  document.querySelectorAll('.opt-btn').forEach((b,idx)=>b.classList.toggle('selected',idx===i));
  selectedOption=i;
  document.getElementById('btn-next').disabled=false;
}

function onTextInput(val){
  textAnswer=val;
  const btn=document.getElementById('btn-next');
  if(btn)btn.disabled=val.trim().split(/\s+/).length<4;
}

function nextQuestion(){
  const q=QUESTIONS[currentQ];
  if(q.type==='single'&&selectedOption!==null){
    const chosen=q.options[selectedOption];
    for(const[sin,val]of Object.entries(chosen.sins)){scores[sin]=(scores[sin]||0)+val;}
    answers.push({q:currentQ,type:'single',answer:q.options[selectedOption].text});
  } else if(q.type==='text'&&textAnswer.trim()){
    const result=analyzeText(textAnswer,q.sins_map);
    for(const[sin,val]of Object.entries(result)){if(scores.hasOwnProperty(sin))scores[sin]=(scores[sin]||0)+val;}
    answers.push({q:currentQ,type:'text',question:q.text,answer:textAnswer});
    textAnswers.push({question:q.text,answer:textAnswer});
  }
  currentQ++;
  if(currentQ>=QUESTIONS.length)renderResult();
  else renderQuestion();
}

function startTest(){
  const nf=document.getElementById('name-field');
  userName=nf?nf.value.trim():'';
  currentQ=0;
  scores={superbia:0,avaritia:0,luxuria:0,invidia:0,gula:0,ira:0,acedia:0};
  answers=[];textAnswers=[];
  renderQuestion();
}

function computePcts(){
  const minScore=1;
  const adjusted={};
  for(const[k,v]of Object.entries(scores))adjusted[k]=Math.max(v,minScore);
  const adjTotal=Object.values(adjusted).reduce((a,b)=>a+b,0);
  const pcts={};
  for(const[k,v]of Object.entries(adjusted))pcts[k]=Math.round((v/adjTotal)*100);
  const fix=Object.values(pcts).reduce((a,b)=>a+b,0)-100;
  const keys=Object.keys(pcts).sort((a,b)=>pcts[b]-pcts[a]);
  pcts[keys[0]]-=fix;
  return{pcts,dominant:keys[0],keys};
}

function exportTxt(){
  const sin=SINS[finalDominant];
  const dateStr=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'});
  const header=userName?`SEPTEM PECCATA MORTALIA — Resultado de ${userName}`:'SEPTEM PECCATA MORTALIA — Resultado';
  let txt=`${header}\n`;
  txt+=`Fecha: ${dateStr}\n`;
  txt+=`${'─'.repeat(50)}\n\n`;
  txt+=`PECADO DOMINANTE: ${sin.name.toUpperCase()} (${sin.latin})\n\n`;
  txt+=`${sin.desc}\n\n`;
  txt+=`${'─'.repeat(50)}\n`;
  txt+=`COMPOSICIÓN DEL ALMA\n`;
  txt+=`${'─'.repeat(50)}\n`;
  const sorted=Object.keys(finalPcts).sort((a,b)=>finalPcts[b]-finalPcts[a]);
  for(const k of sorted){
    const bar='█'.repeat(Math.round(finalPcts[k]/5))+'░'.repeat(20-Math.round(finalPcts[k]/5));
    txt+=`${SINS[k].name.padEnd(12)} ${bar} ${String(finalPcts[k])+'%'}\n`;
  }
  txt+=`\n${'─'.repeat(50)}\n`;
  txt+=`VIRTUD PENDIENTE\n`;
  txt+=`${'─'.repeat(50)}\n`;
  txt+=`${VIRTUES[finalDominant]}\n\n`;
  txt+=`${'─'.repeat(50)}\n`;
  txt+=`RESPUESTAS ABIERTAS\n`;
  txt+=`${'─'.repeat(50)}\n`;
  for(let i=0;i<textAnswers.length;i++){
    txt+=`\nPregunta ${i+1}:\n${textAnswers[i].question}\n\nRespuesta:\n${textAnswers[i].answer}\n`;
  }
  txt+=`\n${'─'.repeat(50)}\n`;
  txt+=`Generado con Septem Peccata Mortalia\n`;

  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const filename=(userName?userName.replace(/\s+/g,'_')+'_':'')+'pecados_capitales.txt';
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

function renderResult(){
  const{pcts,dominant,keys}=computePcts();
  finalPcts=pcts;finalDominant=dominant;
  const sin=SINS[dominant];
  const barColors={superbia:'#9b59b6',avaritia:'#f39c12',luxuria:'#e74c3c',invidia:'#1abc9c',gula:'#e67e22',ira:'#c0392b',acedia:'#7f8c8d'};
  const barsHTML=keys.map(k=>{
    const s=SINS[k];const pct=pcts[k];const isDom=k===dominant;
    return`<div class="sin-bar-row ${isDom?'dominant':''}"><span class="sin-bar-label">${s.name}</span><div class="sin-bar-track"><div class="sin-bar-fill" id="bar-${k}" style="background:${barColors[k]};width:0%"></div></div><span class="sin-bar-pct">${pct}%</span></div>`;
  }).join('');
  const nameHeader=userName?`<p class="block-label" style="text-align:center;margin-bottom:0.3rem">${userName}</p>`:'';
  document.getElementById('screen').innerHTML=`
    <div class="result-wrap">
      <div class="result-header">
        <span class="result-sin-icon">${sin.icon}</span>
        ${nameHeader}
        <p class="block-label" style="text-align:center;margin-bottom:0.4rem">Tu pecado capital dominante</p>
        <h2 class="result-sin-name">${sin.name}</h2>
        <p class="result-sin-latin">${sin.latin}</p>
        <p class="result-desc">${sin.desc}</p>
      </div>
      <div class="divider"></div>
      <div class="bars-section">
        <p class="bars-title">Composición de tu alma</p>
        ${barsHTML}
      </div>
      <div class="divider"></div>
      <div class="virtue-section">
        <p class="virtue-label">Tu virtud pendiente</p>
        <p class="virtue-text">${VIRTUES[dominant]}</p>
      </div>
      <div class="ornament">✦ ✦ ✦</div>
      <div class="btn-row">
        <button class="btn-export" onclick="exportTxt()"><i class="ti ti-download" aria-hidden="true"></i> Exportar resultado</button>
        <button class="btn-restart" onclick="restartTest()">Repetir el examen</button>
      </div>
      <p class="export-note">El .txt incluye porcentajes, descripción y todas tus respuestas abiertas</p>
    </div>`;
  setTimeout(()=>{keys.forEach(k=>{const el=document.getElementById('bar-'+k);if(el)el.style.width=pcts[k]+'%';});},200);
}

function restartTest(){
  userName='';finalPcts={};finalDominant='';textAnswers=[];
  renderCover();
}

renderCover();
</script>
